<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Skill</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff2ea;color:#29483b;font:15px 'Segoe UI',system-ui}header{padding:24px 4vw;background:#fafcf6;display:flex;justify-content:space-between;border-bottom:1px solid #d6dfcd}.brand{font-size:26px;font-weight:750}button,select{font:inherit;color:inherit;border:1px solid #cbd5c2;background:white;border-radius:10px;padding:10px 16px;cursor:pointer}main{max-width:1600px;margin:auto;padding:25px 4vw}h1{font-size:32px;margin:6px 0}h2{font-size:16px;margin:0 0 14px}p{font-size:13px;color:#71806b;line-height:1.7}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:20px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px}.stage,.card{border:1px solid #d4decb;border-radius:20px;overflow:hidden;background:#fafcf6}.card{padding:24px;margin-bottom:18px}.tabs{display:flex;gap:10px;padding:18px}button[aria-pressed=true]{background:#315c45;color:white}iframe{display:block;width:100%;height:clamp(410px,60vh,750px);border:0;background:#f5f5ed}.foot{padding:16px;font-size:12px;color:#7e8a75;border-top:1px solid #e1e6d9}.score{font-size:78px;letter-spacing:-4px}.score small{font-size:19px;letter-spacing:0;color:#8a9581}.tag{display:inline-block;padding:7px 10px;background:#e7eedc;border-radius:6px;font-size:12px}.row{display:flex;justify-content:space-between;border-top:1px solid #dde4d5;padding:12px 0;font-size:12px}.history{margin-top:22px}#history{display:flex;gap:10px;overflow:auto}#history button{text-align:left;min-width:190px}#history b{display:block;font-size:24px;margin-top:8px}#error{padding:60px;white-space:pre-wrap;min-height:410px;color:#a25136}[hidden]{display:none!important}@media(max-width:900px){.grid{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}aside{display:grid;grid-template-columns:1fr 1fr;gap:15px}}@media(max-width:550px){aside{grid-template-columns:1fr}main{padding:16px}h1{font-size:26px}select{max-width:100%}}
</style><header><span class="brand">Test Skill.</span><button id="full">⛶ 全屏</button></header><main><div class="top"><div><p>MODEL CHECK / SVG ANIMATION</p><h1>让表现，自己说话。</h1><p id="subtitle">正在读取结果…</p></div><select id="runs" aria-label="选择历史记录"></select></div><div class="grid"><section class="stage"><nav class="tabs" id="animals" aria-label="切换动物"></nav><iframe id="preview" sandbox="allow-scripts" title="本次生成的骑行动画"></iframe><div id="error" hidden></div><div class="foot" id="detail"></div></section><aside><section class="card"><h2>结构跑分</h2><div class="score"><span id="score">—</span><small> / 100</small></div><div class="tag" id="passed"></div><p>固定程序检查 SVG 合规、接触点与 16 个运动相位。美观和物种准确度不包含在分数中。</p><div class="row"><span>生成次数</span><b>首轮 · 不自动修补</b></div><div class="row"><span>每种动物上限</span><b>30 个元素</b></div><div class="row"><span>程序处理耗时</span><b id="timing">未记录</b></div><div class="row"><span>模型</span><b id="model">未记录</b></div></section><section class="card"><h2>有没有退步？</h2><strong id="comparison"></strong><p id="evidence"></p><p>同一模型、相同设置，在新对话中重复测试。一次动画不能证明模型被降质。</p></section></aside></div><section class="card history"><h2>本机历史 · 自动保存</h2><div id="history"></div></section><p>下次：选好模型，在新对话输入 <b>$test-skill</b>。只想重看结果，输入 <b>$test-skill 查看</b>，无需重新生成。</p></main><script type="module">
const $=id=>document.getElementById(id),labels={pelican:'鹈鹕',cat:'猫',octopus:'章鱼',rabbit:'兔子',penguin:'企鹅',frog:'青蛙',monkey:'猴子',giraffe:'长颈鹿',snake:'蛇'};let runs=[];
function animal(run,r){for(const b of $('animals').children)b.setAttribute('aria-pressed',String(b.dataset.animal===r.animal));const ok=r.validation?.pass&&r.artifacts.html;$('preview').hidden=!ok;$('error').hidden=!!ok;if(ok)$('preview').src='/runs/'+run.id+'/'+r.animal+'/preview.html';else{$('preview').removeAttribute('src');$('error').textContent=r.executionError||JSON.stringify(r.validation?.errors||['校验未通过'],null,2);}$('detail').textContent=(labels[r.animal]||r.animal)+' · '+(r.validation?.elementCount??'—')+' 个元素 · '+(ok?'结构检查通过':'原始失败已保留')+' · '+(run.kind==='demo'?'内置演示，非模型成绩':'本次模型生成');}
function show(id){const r=runs.find(r=>r.id===id)||runs[0];if(!r)return;$('runs').value=r.id;$('score').textContent=r.score??'—';$('passed').textContent=r.passed+' / '+r.total+' 项通过'+(r.kind==='demo'?' · 演示数据':'');$('model').textContent=r.model||'未记录';$('timing').textContent=r.processingMs==null?'未记录':(r.processingMs/1000).toFixed(2)+' 秒（不含生成）';$('subtitle').textContent=new Date(r.createdAt).toLocaleString()+' · '+(r.kind==='demo'?'演示模式：不代表任何模型的成绩':'本次测试 · '+r.total+' 种动物');$('animals').replaceChildren();for(const t of r.reports){const b=document.createElement('button');b.textContent=labels[t.animal]||t.animal;b.dataset.animal=t.animal;b.onclick=()=>animal(r,t);$('animals').append(b);}animal(r,r.reports[0]);const prev=runs.filter(p=>p.kind!=='demo'&&p.createdAt<r.createdAt&&p.condition===r.condition&&p.score!==null);let title,text;if(r.kind==='demo'){title='演示不参与比较';text='运行一次 $test-skill，才会生成当前模型的真实测试记录。';}else if(!r.model||!r.settings){title='测试条件记录不完整';text='分数已保存；缺少可信模型名或设置，暂不自动判断退步。';}else if(prev.length<3||r.score===null){title='历史样本不足';text='同条件有效历史 '+prev.length+' 次；至少积累 3 次作为参考。';}else{const s=prev.slice(0,10).map(p=>p.score).sort((a,b)=>a-b),m=(s[Math.floor((s.length-1)/2)]+s[Math.floor(s.length/2)])/2,d=r.score-m;title=d<0?'本次结构表现下降':'本次未出现结构分数下降';text='相对历史中位数 '+m.toFixed(1)+' 分，本次 '+(d>=0?'+':'')+d.toFixed(1)+' 分。只是回退线索，还需重复验证。';}$('comparison').textContent=title;$('evidence').textContent=text;}
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('full').textContent='按 F11 全屏';}};$('runs').onchange=()=>show($('runs').value);
try{runs=await(await fetch('/api/runs')).json();for(const r of runs){const o=document.createElement('option');o.value=r.id;o.textContent=new Date(r.createdAt).toLocaleString()+(r.kind==='demo'?' · 演示':' · '+(r.model||'未标注模型'));$('runs').append(o);const b=document.createElement('button'),s=document.createElement('small'),v=document.createElement('b');s.textContent=o.textContent;v.textContent=(r.score??'—')+' / 100';b.append(s,v);b.onclick=()=>show(r.id);$('history').append(b);}if(runs.length)show(new URLSearchParams(location.search).get('run'));else{$('subtitle').textContent='没有测试记录。在新对话输入 $test-skill 即可开始。';$('preview').hidden=true;}}catch{$('subtitle').textContent='读取失败，请运行 $test-skill 查看。';}
</script></html>
